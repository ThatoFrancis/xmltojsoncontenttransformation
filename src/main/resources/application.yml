spring:
  application:
    name: xmltojsoncontenttransformation
  profiles:
    active: local

app:
  pipeline:
    concurrency: 4
    max-document-size-bytes: 10485760
  storage:
    output-dir: ./output

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
